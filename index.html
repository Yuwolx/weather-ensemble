<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>기상 합의 · 앙상블 날씨</title>
    <meta
      name="description"
      content="여러 예보 모델을 그대로 모아 날씨를 하나의 숫자가 아닌 확률 분포로 보여주는 앙상블 날씨 계기판"
    />
    <!-- PWA: installable to the phone home screen, opens fullscreen like an app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="기상합의" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard: the Korean text IS the interface — system Malgun Gothic reads
         like a government form; this is the single highest-leverage premium move -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <canvas class="rainfx" id="rain" aria-hidden="true"></canvas>
    <div class="page">
      <!-- ===== Top bar: brand + location controls in one quiet line ===== -->
      <header class="top">
        <div class="brand">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__name">ENSEMBLE</span>
          <span class="brand__sub">기상 합의</span>
        </div>
        <div class="top__loc">
          <div class="favs" id="favs"></div>
          <form class="search" id="searchForm" role="search" autocomplete="off">
            <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6" />
              <line x1="13.5" y1="13.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <input
              class="search__input"
              id="searchInput"
              type="text"
              placeholder="지역 검색"
              aria-label="전국 시군구 검색"
              aria-expanded="false"
              aria-controls="suggest"
            />
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </form>
          <button class="geo" id="geoBtn" type="button" title="현재 위치">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="3" fill="currentColor" />
              <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <line x1="10" y1="0.5" x2="10" y2="3" stroke="currentColor" stroke-width="1.5" />
              <line x1="10" y1="17" x2="10" y2="19.5" stroke="currentColor" stroke-width="1.5" />
              <line x1="0.5" y1="10" x2="3" y2="10" stroke="currentColor" stroke-width="1.5" />
              <line x1="17" y1="10" x2="19.5" y2="10" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- ===== One sheet of sky ===== -->
      <main class="sheet">
        <div class="sheet__head">
          <h1 class="loc__name" id="vRegion">—</h1>
          <div class="daytabs" id="dayTabs" role="tablist" aria-label="날짜"></div>
        </div>

        <!-- Hero: the selected hour's scenario spread -->
        <section class="board" id="board" aria-label="선택 시각 시나리오"></section>

        <!-- Timeline: pick a different hour -->
        <section class="strip" aria-label="시간별 분포">
          <p class="strip__label">시간별 — 눌러서 다른 시각 보기</p>
          <div class="stripwrap">
            <div class="strip__axis" id="stripAxisY" aria-hidden="true"></div>
            <div class="strip__cols" id="stripCols" role="group" aria-label="시간별 막대. 화살표 키로 시각을 이동합니다."></div>
          </div>
          <div class="strip__times" id="stripTimes" aria-hidden="true"></div>
          <ul class="legend" id="legend" aria-label="막대 색상 의미"></ul>
        </section>

        <!-- Retrospect: what the odds said then vs what actually happened -->
        <section class="retro" id="retro" aria-label="어제 돌아보기"></section>

        <footer class="method">
          <p class="method__src">여러 기관의 앙상블 예보를 그대로 세어 확률로 보여줍니다. 저희가 다시 예측하지 않습니다.</p>
        </footer>
      </main>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay__box">
        <div class="spinner" id="spinner"></div>
        <p class="overlay__msg" id="overlayMsg">앙상블 예보를 불러오는 중…</p>
        <button class="btn" id="retryBtn" type="button" hidden>다시 시도</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
      // register the service worker (installability + offline); harmless if unsupported
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
